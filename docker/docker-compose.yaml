version: "3.9"
services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    volumes:
      - ./config:/config/
      # mesh daemon state (device keys, sequence numbers) and attach token must survive recreates
      - ./mesh:/var/lib/bluetooth/mesh
      - ./token:/root/.cache/bluetooth-mesh
      # the local mesh node UUID is derived from the machine-id: pin it, otherwise every rebuilt image is a new node
      - ./machine-id:/etc/machine-id:ro
    restart: "always"
    network_mode: "host"
    privileged: true
    tty: true